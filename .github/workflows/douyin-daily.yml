name: douyin-daily

on:
  schedule:
    # 北京时间每天 07:00 = UTC 23:00（GitHub Actions 用 UTC）
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run（只定位不发送）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  TZ: Asia/Shanghai
  HEADLESS: 'true'

jobs:
  douyin-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Decode storage state
        env:
          DOUYIN_STORAGE_STATE_B64: ${{ secrets.DOUYIN_STORAGE_STATE_B64 }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          import sys

          b64 = os.getenv("DOUYIN_STORAGE_STATE_B64", "").strip()
          if not b64:
              print("::error::Secret DOUYIN_STORAGE_STATE_B64 未配置", file=sys.stderr)
              sys.exit(1)

          # 1) base64 解码
          raw = base64.b64decode(b64)

          # 2) 判断 gzip 魔数 0x1f 0x8b：是则解压，否则直接使用（兼容未压缩版本）
          if raw[:2] == b"\x1f\x8b":
              print("检测到 gzip 魔数，执行 gzip 解压")
              content = gzip.decompress(raw)
          else:
              print("未检测到 gzip 魔数，按未压缩 JSON 处理")
              content = raw

          # 3) 校验是否为合法 JSON（UTF-8）
          try:
              import json
              json.loads(content.decode("utf-8"))
          except Exception as exc:
              print(f"::error::storage_state 内容不是合法 JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          # 4) 写入 storage_state.json
          with open("storage_state.json", "wb") as f:
              f.write(content)

          print(f"storage_state.json 已生成 ({len(content)} bytes)")
          PY

      - name: Run Douyin auto-message
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          DOUYIN_FRIEND_NAME: ${{ secrets.DOUYIN_FRIEND_NAME }}
          DOUYIN_MESSAGE: ${{ secrets.DOUYIN_MESSAGE }}
          DOUYIN_VIDEO_URL: ${{ secrets.DOUYIN_VIDEO_URL }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: python -m src.main

      - name: Upload logs & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-run-artifacts
          path: |
            logs/
            screenshots/
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          python -c "
          import os
          from src.notifier import notify_result
          notify_result(os.getenv('NOTIFY_WEBHOOK',''), False, 'GitHub Actions 运行失败', '请查看 Actions 日志与 artifact 中的截图。')
          " || true
